# LabRepo Production Docker Compose
name: "labrepo"

services:
  # ─── PostgreSQL ───────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: labrepo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-labrepo_secret}
      POSTGRES_DB: labrepo
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labrepo -d labrepo"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  # ─── MinIO (S3-compatible storage) ────────────────
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - internal
      - external
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  # ─── Backend (Fastify API) ───────────────────────
  backend:
    image: labrepo-backend
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://labrepo:${POSTGRES_PASSWORD:-labrepo_secret}@postgres:5432/labrepo
      AWS_ENDPOINT: http://minio:9000
      API_PORT: "3001"
      API_HOST: "0.0.0.0"
      NODE_OPTIONS: "--dns-result-order=ipv4first"
    ports:
      - "3001:3001"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - internal
      - external
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  # ─── Frontend (Astro SSR) ────────────────────────
  frontend:
    image: labrepo-frontend
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: "0.0.0.0"
      PORT: "4321"
      INTERNAL_API_URL: "http://backend:3001"
      NODE_OPTIONS: "--dns-result-order=ipv4first"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal
      - external
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4321/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  # ─── Nginx (Reverse Proxy) ──────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    command: >
      /bin/sh -c "
        mkdir -p /etc/nginx/ssl_config;
        if [ -f /etc/letsencrypt/live/labrepo.app/fullchain.pem ]; then
          echo 'Using Let''s Encrypt certificates';
          echo 'ssl_certificate /etc/letsencrypt/live/labrepo.app/fullchain.pem;' > /etc/nginx/ssl_config/ssl.conf;
          echo 'ssl_certificate_key /etc/letsencrypt/live/labrepo.app/privkey.pem;' >> /etc/nginx/ssl_config/ssl.conf;
          echo 'return 301 https://$$host$$request_uri;' > /etc/nginx/ssl_config/http_redirect.conf;
        else
          echo 'Using local development certificates';
          echo 'ssl_certificate /etc/nginx/certs/fullchain.pem;' > /etc/nginx/ssl_config/ssl.conf;
          echo 'ssl_certificate_key /etc/nginx/certs/privkey.pem;' >> /etc/nginx/ssl_config/ssl.conf;
          echo '' > /etc/nginx/ssl_config/http_redirect.conf;
        fi;
        exec nginx -g 'daemon off;'
      "
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - internal
      - external
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # ─── Certbot (SSL Certificates) ────────────────
  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  postgres-data:
  minio-data:

networks:
  internal:
    driver: bridge
    internal: true
  external:
    driver: bridge
